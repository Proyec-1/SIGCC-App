<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGCC CICPC</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0a1929,#0c2d48);min-height:100vh;padding:20px;}
        .container{max-width:500px;margin:0 auto;background:white;border-radius:25px;padding:30px;box-shadow:0 20px 40px rgba(0,0,0,0.3);}
        .logo{text-align:center;margin-bottom:25px;}
        .logo h1{color:#0a4c8c;font-size:2.2em;}
        .logo p{color:#666;font-size:12px;}
        input{width:100%;padding:12px;margin:10px 0;border:2px solid #ddd;border-radius:12px;}
        button{width:100%;padding:12px;background:#0a4c8c;color:white;border:none;border-radius:12px;font-weight:bold;cursor:pointer;}
        .error{color:red;text-align:center;margin-top:10px;}
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>SIGCC</h1>
            <p>Sistema de Gestión de Cadena de Custodia</p>
            <p style="font-size:11px;color:#0a4c8c;">CICPC - División Criminalística</p>
        </div>
        <div class="login-box">
            <h2>Acceso Autorizado</h2>
            <input type="text" id="cedula" placeholder="Cédula (Ej: V32136846)">
            <input type="password" id="password" placeholder="Contraseña">
            <button id="btnLogin">Ingresar</button>
            <div id="errorMsg" class="error"></div>
        </div>
    </div>
    <script>
        // USUARIO ÚNICO: José Moreno
        const USUARIO_VALIDO = {
            cedula: 'V32136846',
            password: 'Cadete2-2025',
            nombre: 'José Moreno',
            jerarquia: 'Comisario General Superior Nacional'
        };
        
        document.getElementById('btnLogin').addEventListener('click', function() {
            const cedula = document.getElementById('cedula').value.trim();
            const password = document.getElementById('password').value;
            
            if (cedula === USUARIO_VALIDO.cedula && password === USUARIO_VALIDO.password) {
                localStorage.setItem('usuarioActual', JSON.stringify(USUARIO_VALIDO));
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('errorMsg').innerHTML = '❌ Credenciales incorrectas. Acceso denegado.';
            }
        });
    </script>
</body>
</html>
