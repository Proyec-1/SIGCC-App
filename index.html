<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SIGCC - Sistema de Cadena de Custodia</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>SIGCC</h1>
            <p>Sistema Inteligente de Gestión de Cadena de Custodia</p>
            <small>UNES "Ezequiel Zamora" - San Carlos, Cojedes</small>
        </div>
        
        <div class="login-box">
            <h2>Acceso al Sistema</h2>
            <input type="text" id="cedula" placeholder="Número de Cédula (ej: V12345678)" autocomplete="off">
            <input type="password" id="password" placeholder="Contraseña">
            <button id="btnLogin">Ingresar</button>
            <div id="errorMsg" class="error"></div>
            <div class="info">
                <strong>Credenciales:</strong><br>
                Jefe: V12345678 / admin123<br>
                Funcionario: V87654321 / user123
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
