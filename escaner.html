<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SIGCC - Escáner QR</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0a1929,#0c2d48);min-height:100vh;padding:20px;}
        .container{max-width:600px;margin:0 auto;background:white;border-radius:25px;padding:25px;}
        input{width:100%;padding:12px;margin:10px 0;border:2px solid #ddd;border-radius:12px;font-size:16px;}
        button{background:#0a4c8c;color:white;padding:12px;border:none;border-radius:12px;cursor:pointer;width:100%;margin-top:10px;font-size:16px;font-weight:bold;}
        .back-btn{background:#666;width:auto;padding:8px 15px;margin-bottom:15px;}
        .resultado{background:#e8f5e9;padding:15px;border-radius:12px;margin-top:15px;}
        .error-resultado{background:#ffebee;padding:15px;border-radius:12px;margin-top:15px;}
        h2{margin-bottom:15px;color:#0a4c8c;}
        .modo-buttons{display:flex;gap:10px;margin:15px 0;}
        .modo-btn{flex:1;background:#e0e0e0;color:#333;margin:0;}
        .modo-btn.activo{background:#0a4c8c;color:white;}
        .camara-box{background:#000;border-radius:15px;overflow:hidden;margin:10px 0;}
        #reader{width:100%;}
        .info{background:#e3f2fd;padding:10px;border-radius:12px;margin:10px 0;font-size:12px;text-align:center;}
    </style>
</head>
<body>
    <div class="container">
        <h2>📷 Verificar Cadena de Custodia</h2>
        <button onclick="volver()" class="back-btn">← Volver</button>

        <div class="modo-buttons">
            <button id="btnModoId" class="modo-btn activo" onclick="mostrarModo('id')">🔢 Buscar por ID</button>
            <button id="btnModoCamara" class="modo-btn" onclick="mostrarModo('camara')">📷 Escanear QR</button>
        </div>

        <!-- MODO ID -->
        <div id="modoId">
            <input type="number" id="buscarId" placeholder="Ingrese el número de ID de la cadena">
            <button onclick="verificarPorId()">🔍 Verificar</button>
        </div>

        <!-- MODO CÁMARA -->
        <div id="modoCamara" style="display:none;">
            <div class="info">
                📌 Permite el acceso a la cámara cuando el navegador lo pida.<br>
                Apunta al código QR de la evidencia.
            </div>
            <div id="reader" class="camara-box"></div>
            <button id="btnDetener" style="background:#666; display:none;" onclick="detenerCamara()">⏹️ Detener Cámara</button>
            <div id="lecturaResultado" style="margin-top:10px; text-align:center; font-weight:bold;"></div>
        </div>

        <div id="resultado"></div>
    </div>

    <script>
        let html5QrCode = null;
        let escaneoActivo = false;
        
        function volver() {
            detenerCamara();
            window.location.href = 'dashboard.html';
        }
        
        function mostrarModo(modo) {
            const modoId = document.getElementById('modoId');
            const modoCamara = document.getElementById('modoCamara');
            const btnId = document.getElementById('btnModoId');
            const btnCamara = document.getElementById('btnModoCamara');
            
            if (modo === 'id') {
                modoId.style.display = 'block';
                modoCamara.style.display = 'none';
                btnId.classList.add('activo');
                btnCamara.classList.remove('activo');
                detenerCamara();
            } else {
                modoId.style.display = 'none';
                modoCamara.style.display = 'block';
                btnId.classList.remove('activo');
                btnCamara.classList.add('activo');
                iniciarCamara();
            }
        }
        
        async function iniciarCamara() {
            if (escaneoActivo) return;
            
            try {
                html5QrCode = new Html5Qrcode("reader");
                escaneoActivo = true;
                document.getElementById('btnDetener').style.display = 'block';
                
                const config = { fps: 10, qrbox: { width: 250, height: 250 } };
                
                await html5QrCode.start(
                    { facingMode: "environment" },
                    config,
                    onScanSuccess,
                    onScanError
                );
            } catch (err) {
                document.getElementById('lecturaResultado').innerHTML = '❌ No se pudo acceder a la cámara. Verifica los permisos.';
                document.getElementById('lecturaResultado').style.color = 'red';
                escaneoActivo = false;
                document.getElementById('btnDetener').style.display = 'none';
            }
        }
        
        function onScanSuccess(decodedText) {
            try {
                const datos = JSON.parse(decodedText);
                if (datos.id) {
                    detenerCamara();
                    verificarPorId(datos.id);
                } else {
                    document.getElementById('lecturaResultado').innerHTML = '⚠️ QR no válido para SIGCC';
                    setTimeout(() => { document.getElementById('lecturaResultado').innerHTML = ''; }, 2000);
                }
            } catch(e) {
                document.getElementById('lecturaResultado').innerHTML = '⚠️ QR no reconocido por el sistema';
                setTimeout(() => { document.getElementById('lecturaResultado').innerHTML = ''; }, 2000);
            }
        }
        
        function onScanError(error) {
            // Solo para depuración, no mostrar errores al usuario
        }
        
        function detenerCamara() {
            if (html5QrCode && escaneoActivo) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    escaneoActivo = false;
                    document.getElementById('btnDetener').style.display = 'none';
                    document.getElementById('lecturaResultado').innerHTML = '';
                }).catch(() => {});
            }
        }
        
        function verificarPorId(idRecibido = null) {
            let id = idRecibido;
            if (!id) {
                id = parseInt(document.getElementById('buscarId').value);
                if (!id) {
                    alert('❌ Ingrese un ID válido');
                    return;
                }
            }
            
            const request = indexedDB.open('SIGCC_DB', 1);
            request.onsuccess = (e) => {
                const db = e.target.result;
                const tx = db.transaction(['cadenas'], 'readonly');
                const store = tx.objectStore('cadenas');
                const get = store.get(id);
                const div = document.getElementById('resultado');
                
                get.onsuccess = () => {
                    const c = get.result;
                    if (c) {
                        div.innerHTML = `<div class="resultado">
                            <h3>✅ CADENA DE CUSTODIA VÁLIDA</h3>
                            <p><strong>ID:</strong> ${c.id}</p>
                            <p><strong>Descripción:</strong> ${c.descripcion}</p>
                            <p><strong>Lugar de hallazgo:</strong> ${c.lugar}</p>
                            <p><strong>Delegación:</strong> ${c.delegacion}</p>
                            <p><strong>Fecha del hallazgo:</strong> ${c.fecha}</p>
                            <p><strong>Observaciones:</strong> ${c.observaciones || 'Ninguna'}</p>
                            <p><strong>Estado:</strong> 🔵 ACTIVA</p>
                            <p><strong>Creado por:</strong> ${c.creadorNombre}</p>
                            <p><strong>Fecha de registro:</strong> ${new Date(c.fechaCreacion).toLocaleString()}</p>
                        </div>`;
                    } else {
                        div.innerHTML = `<div class="error-resultado">
                            <h3>❌ CADENA NO ENCONTRADA</h3>
                            <p>No existe ninguna cadena con ID #${id}</p>
                        </div>`;
                    }
                    
                    // Limpiar input si viene de escáner
                    if (idRecibido) {
                        document.getElementById('buscarId').value = '';
                    }
                };
            };
        }
        
        window.verificarPorId = verificarPorId;
        window.mostrarModo = mostrarModo;
        window.volver = volver;
        window.detenerCamara = detenerCamara;
    </script>
</body>
</html>
